[package]
edition.workspace = true
name = "alpen-prover-perf"
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
alpen-params = { workspace = true, features = ["test-utils"] }
alpen-test-utils-evm-workload.workspace = true
ssz.workspace = true
zkaleido.workspace = true
zkaleido-perf-report.workspace = true

# proof programs
alpen-proof-acct = { workspace = true, features = ["test-utils"] }
alpen-proof-chunk = { workspace = true, features = ["test-utils"] }

alpen-chain-types.workspace = true

# sp1
alpen-sp1-guest-builder = { path = "../../provers/sp1", optional = true }
sp1-sdk.workspace = true
zkaleido-sp1-host = { workspace = true, optional = true }

anyhow.workspace = true
clap = { workspace = true, features = [
  "std",
  "help",
  "usage",
  "error-context",
] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = ["sp1"]
sp1 = [
  "zkaleido-sp1-host/perf",
  "dep:zkaleido-sp1-host",
  "dep:alpen-sp1-guest-builder",
]
