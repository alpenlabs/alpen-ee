alpen-reth-statediff.workspace = true
strata-acct-types.workspace = true
strata-codec.workspace = true
strata-l1-envelope-fmt.workspace = true
strata-msg-fmt.workspace = true
strata-snark-acct-runtime.workspace = true
strata-snark-acct-types.workspace = true

alloy-consensus.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
bitcoin.workspace = true
reth-ethereum-primitives.workspace = true

# sp1
alpen-sp1-guest-builder = { path = "../../provers/sp1", optional = true }
sp1-sdk.workspace = true
zkaleido-sp1-host = { workspace = true, optional = true }

anyhow.workspace = true
clap = { workspace = true, features = [
  "std",
  "help",
  "usage",
  "error-context",
] }
serde_json.workspace = true
