[package]
edition.workspace = true
name = "alpen-dbconsole"
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "dbconsole"
path = "src/main.rs"

[dependencies]
alpen-database.workspace = true
alpen-dbconsole-core.workspace = true

clap = { workspace = true, features = [
  "derive",
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
  "color",
] }
dirs.workspace = true
eyre.workspace = true
hex.workspace = true
libc.workspace = true
rhai = { workspace = true, features = ["metadata"] }
rustyline = { workspace = true, features = ["derive"] }
signal-hook.workspace = true
sled.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
alpen-dbconsole-core = { workspace = true, features = ["test-utils"] }
alpen-database = { workspace = true, features = ["test-utils"] }
