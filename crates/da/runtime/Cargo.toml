[package]
edition.workspace = true
name = "alpen-da-runtime"
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Off by default: the guest/proof side links only the verifier. The host-side
# prover enables `builders` to construct DA witnesses.
default = []
builders = [
  "dep:alpen-common",
  "dep:async-trait",
  "dep:bitcoind-async-client",
  "dep:strata-identifiers",
  "dep:strata-primitives",
]

[dependencies]
alpen-common = { workspace = true, optional = true }
alpen-da-types.workspace = true
alpen-params.workspace = true
alpen-reth-statediff.workspace = true

alloy-primitives.workspace = true
alpen-acct-runtime.workspace = true
alpen-chain-types.workspace = true
alpen-evm-ee.workspace = true
async-trait = { workspace = true, optional = true }
bitcoin.workspace = true
bitcoind-async-client = { workspace = true, optional = true }
revm-primitives.workspace = true
ssz.workspace = true
strata-acct-types.workspace = true
strata-codec.workspace = true
strata-identifiers = { workspace = true, optional = true }
strata-primitives = { workspace = true, optional = true }
strata-snark-acct-types.workspace = true
thiserror.workspace = true

[dev-dependencies]
rkyv.workspace = true
rsp-mpt.workspace = true
sha2.workspace = true
strata-l1-envelope-fmt.workspace = true
