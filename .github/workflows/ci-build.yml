# Builds one selected Docker image on manual dispatch and pushes it to the
# shared ECR account (private) and, for images that have one, the public ECR
# gallery.
#
# The image does not ship the SP1 guest ELFs. Each network's guests bake in
# its params, so release.yml publishes them per network instead.

name: CI — Build and Push Images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build from (default: current branch)"
        required: false
        type: string
      component:
        description: "Image to build"
        required: true
        default: alpen-client
        type: choice
        options:
          - alpen-client
          - alpen-da-verifier

env:
  AWS_REGION: us-east-1

# Independently selected image builds must not cancel each other.
concurrency:
  group: ci-build-${{ github.ref }}-${{ inputs.component }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # Build and push the selected image
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build ${{ inputs.component }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      short_tag: ${{ steps.resolve.outputs.short_tag }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      image_name: ${{ steps.resolve.outputs.image_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve actual commit SHA
        id: resolve
        env:
          IMAGE_NAME: ${{ inputs.component }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_TAG="${COMMIT_SHA:0:7}"
          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "short_tag=${SHORT_TAG}"
            echo "image_name=${IMAGE_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved commit: ${COMMIT_SHA} (tag: ${SHORT_TAG})"

      - name: Free up disk space
        uses: $/.github/actions/cleanup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Authenticate to the shared ECR account
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        env:
          ROLE_ARN: ${{ secrets.SHARED_ECR_ROLE_ARN }}
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: "true"

      # Public ECR is a distinct registry (public.ecr.aws) with its own auth
      # token, which must be requested from us-east-1. The same assumed role
      # (SHARED_ECR_ROLE_ARN) is authorized to push the public node images —
      # see alpen-infra github-actions-image-push (STR-3894).
      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      # --- Build and push via Buildx ------------------------------------------
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_PREFIX: ${{ vars.SHARED_ECR_REPOSITORY_PREFIX }}
          # External testnet operators pull public images without AWS
          # credentials (STR-3894). The client retains its existing `alpen`
          # public repository name.
          PUBLIC_ECR_BASE: public.ecr.aws/alpenlabs
          IMAGE_NAME: ${{ inputs.component }}
          SHORT_TAG: ${{ steps.resolve.outputs.short_tag }}
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
        run: |
          case "${IMAGE_NAME}" in
            alpen-client) PUBLIC_REPO=alpen ;;
            # Private only: there is no public repository for the DA
            # verifier, and the role cannot push one (alpen-infra ecr,
            # STR-4580).
            alpen-da-verifier) PUBLIC_REPO="" ;;
            *) echo "Unsupported image: ${IMAGE_NAME}" >&2; exit 1 ;;
          esac

          DOCKERFILE_PATH="docker/${IMAGE_NAME}/Dockerfile"
          FULL_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY_PREFIX}/${IMAGE_NAME}:${SHORT_TAG}"

          TAGS=(-t "${FULL_IMAGE}")
          if [ -n "${PUBLIC_REPO}" ]; then
            TAGS+=(-t "${PUBLIC_ECR_BASE}/${PUBLIC_REPO}:${SHORT_TAG}")
          fi

          # Single build, multiple tags: buildx pushes to the private and (when
          # set) public registries from one image (same digest in both).
          docker buildx build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --push \
            "${TAGS[@]}" \
            -f "${DOCKERFILE_PATH}" .

          echo "Successfully pushed ${IMAGE_NAME}:${SHORT_TAG}"

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  summary:
    name: Build Summary
    needs: [build-and-push]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report results
        env:
          SHORT_TAG: ${{ needs.build-and-push.outputs.short_tag }}
          COMMIT_SHA: ${{ needs.build-and-push.outputs.commit_sha }}
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Commit** | \`${COMMIT_SHA}\` |"
            echo "| **Image** | \`${IMAGE_NAME}\` |"
            echo "| **Image Tag** | \`${SHORT_TAG}\` |"
            echo "| **Ref** | \`${GITHUB_REF_NAME}\` |"
            echo ""
            echo "### Build Status"
            echo "Overall: **${BUILD_RESULT}**"
          } >> "$GITHUB_STEP_SUMMARY"
