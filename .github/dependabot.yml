version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "00:00"
    # Cooldown
    cooldown:
      default-days: 14
    # Group all updates into a single PR
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    commit-message:
      # Use conventional commit format as specified in user rules
      prefix: "chore(deps)"
      include: "scope"

  # Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "00:00"
    # Cooldown
    cooldown:
      default-days: 14
    # The reth/alloy/revm/rsp family is version-locked together (reth is a
    # pinned git tag and rsp tags track specific reth releases), so upgrading
    # any of them requires a coordinated migration of all four plus code
    # changes. Dependabot cannot do that, so its PRs for these deps can never
    # compile — ignore them and upgrade the family deliberately instead.
    ignore:
      - dependency-name: "reth*"
      - dependency-name: "alloy*"
      - dependency-name: "revm*"
      - dependency-name: "rsp-*"
    # Group non-security updates
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Security updates remain ungrouped for urgent handling
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # SP1 guest programs (/provers/sp1/guest-*) are intentionally NOT covered:
  # their manifests only contain path deps into the workspace and pinned
  # sp1-patches git tags, so anything dependabot can touch is a transitive
  # lockfile entry whose version is dictated by the workspace pins. Any guest
  # lockfile change also alters the guest ELF and proof verification keys, so
  # guest deps are updated deliberately alongside workspace upgrades.

  # Python dependencies using uv
  - package-ecosystem: "uv"
    directory: "/functional-tests/"
    schedule:
      interval: "monthly"
      time: "00:00"
    # Cooldown
    cooldown:
      default-days: 14
    # Group all updates into a single PR
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Nix flake
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "00:00"
    # Cooldown
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
