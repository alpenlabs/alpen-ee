# Metrics (and optionally logs) for an alpen-client node.
#
#   docker compose -f docker/observability/compose.yml up
#   docker compose -f docker/observability/compose.yml --profile logs up
#
# Prometheus scrapes the node's `--metrics` endpoint (reth's own metrics plus
# every `reth_alpen_ee_*` series) and Grafana comes up with the "Alpen EE
# Service Map" dashboard provisioned. By default the node is expected on the
# host at port 9001, bound to 0.0.0.0 so the container can reach it; edit
# prometheus/targets/alpen.yml for another host:port, or attach this stack to
# the node's compose network and use the service name.
#
# The `logs` profile adds Loki and an Alloy agent that ships every container's
# stdout, labelled by compose service, for the dashboard's log panels.

# Pinned: the Alloy config drops this project's own containers by this name.
name: observability

services:

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: alpen_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - observability

  grafana:
    image: grafana/grafana:13.2.5
    container_name: alpen_grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: ${GRAFANA_THEME:-dark}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/alpen-ee-service-map.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - observability

  loki:
    image: grafana/loki:3.7.9
    container_name: alpen_loki
    profiles: ["logs"]
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - observability

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alpen_alloy
    profiles: ["logs"]
    depends_on:
      - loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - observability

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

networks:
  observability:
    name: alpen_observability
