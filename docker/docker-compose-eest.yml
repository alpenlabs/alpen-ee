# Setup for Ethereum Execution Spec Tests (EEST).
# Runs alpen-client in sequencer mode with dummy OL + regtest bitcoind for DA.
#
# Node settings live in configs/eest-sequencer.toml, mounted as the node's
# --alpen-config. The bitcoind credentials below are hardcoded so they can't
# drift from that file.
#
# Usage:
#   ./init-alpen-client-keys.sh
#   docker compose --env-file .env.alpen-client -f docker-compose-eest.yml up

services:

  bitcoind:
    build:
      context: ./bitcoind/
    image: strata_bitcoind:v0.1.2
    container_name: eest_bitcoind
    environment:
      RPC_ALLOW_IP: "0.0.0.0/0"
      BITCOIND_RPC_USER: rpcuser
      BITCOIND_RPC_PASSWORD: rpcpassword
      BITCOIND_WALLET: default
      GENERATE_BLOCKS: 101
    volumes:
      - ./bitcoind/entrypoint.sh:/app/entrypoint.sh
    ports:
      - "18443:18443"
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=rpcuser -rpcpassword=rpcpassword getwalletinfo"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - eest

  alpen-client:
    image: alpen-client:latest
    container_name: alpen_eest
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - --p2p-secret-key
      - /app/keys/seq-p2p.hex
      - --port
      - "30303"
      - --nat
      - none
      - --disable-discovery
      # Beyond the entrypoint's default module set: the spec tests poke at
      # debug endpoints, admin is there for peer inspection.
      - --http.api
      - eth,net,web3,txpool,admin,debug
      - --color
      - never
    environment:
      SEQUENCER_PRIVATE_KEY: ${SEQUENCER_PRIVATE_KEY}
      RUST_LOG: ${RUST_LOG:-info}
      ALPEN_CONFIG_PATH: /app/configs/alpen-config.toml
      ALPEN_PARAMS_PATH: ${ALPEN_PARAMS_PATH:-/app/configs/generated/alpen-params.json}
    ports:
      - "8545:8545"
    volumes:
      - ./configs/eest-sequencer.toml:/app/configs/alpen-config.toml:ro
      - ./configs/generated/alpen-params.json:${ALPEN_PARAMS_PATH:-/app/configs/generated/alpen-params.json}:ro
      - ./configs/alpen-client/seq-p2p.hex:/app/keys/seq-p2p.hex:ro
      # Native EE prover signing keys, named by [sequencer.prover] in the
      # mounted config. Checked in rather than generated: this service runs
      # against the dummy OL client (ol.source = "dummy"), whose mock
      # `get_latest_account_update_vk` (see ol/dummy.rs) hardcodes the same
      # fixed acct predicate `EeAcctProgram::test_signing_key` produces
      # (0x02 * 32), so signing with any other acct key fails
      # prover-predicate validation at startup. The chunk key isn't checked
      # externally; 0x03 * 32 matches the functional-tests factory. Neither
      # is a secret -- they stand in for a ZK proof, they don't hold funds.
      - ./configs/alpen-client/native-chunk-signing-key.hex:/app/keys/native-chunk-signing-key.hex:ro
      - ./configs/alpen-client/native-acct-signing-key.hex:/app/keys/native-acct-signing-key.hex:ro
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    networks:
      - eest

networks:
  eest:
    driver: bridge
