# alpen-client config for docker-compose-eest.yml.
#
# Sequencer with a dummy OL client and a regtest bitcoind for DA. Dev/test
# only: the dummy OL client and the native prover are not production paths.

l1_reorg_safe_depth = 1
# Must match GENERATE_BLOCKS on the bitcoind service in the compose file, and
# the genesis height used when generating alpen-params.json.
genesis_l1_height = 101
mode = "sequencer"

[ol]
source = "dummy"

[sequencer]
batch_sealing_block_count = 5

# Skips real Groth16 proving, so no compiled SP1 guest ELFs are needed. The
# key files are mounted by the compose file, next to the p2p key.
[sequencer.prover]
backend = "native"
chunk_signing_key_path = "/app/keys/native-chunk-signing-key.hex"
acct_signing_key_path = "/app/keys/native-acct-signing-key.hex"

[sequencer.bitcoind]
# Throwaway regtest credentials, matching the bitcoind service in the compose
# file. They're in here so the two can't drift, which is fine for a container
# reachable only on the compose network. Don't copy the pattern for a real
# deployment -- keep those credentials out of a file you might commit.
rpc_url = "http://bitcoind:18443"
rpc_user = "rpcuser"
rpc_password = "rpcpassword"
network = "regtest"

[sequencer.l1_fee_policy]
fee_policy = "bitcoind"

[sequencer.da_fee_rate]
policy = "writer_backed"
fallback_policy_rate_wei_per_byte = 10000000000
refresh_interval_seconds = 10
stale_after_seconds = 60
